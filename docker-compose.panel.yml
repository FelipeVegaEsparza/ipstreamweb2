# =====================================================
# CasterFly — sitio público en el VPS del panel
# =====================================================
# Uso:
#   cp .env.example .env
#   docker compose -f docker-compose.panel.yml up -d --build
#
# Caddy del panel sirve casterfly.com -> site:80.
# La base es SQLite (/data/app.db) y los uploads viven en /app/uploads.

services:
  site:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-https://casterfly.com}
    container_name: ipstream-site
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 80
      SITE_URL: ${SITE_URL:-https://casterfly.com}
      DATABASE_PATH: /data/app.db
      UPLOADS_DIR: /app/uploads
      ADMIN_USER: ${ADMIN_USER:?ADMIN_USER es requerido}
      ADMIN_PASS: ${ADMIN_PASS:?ADMIN_PASS es requerido}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET es requerido}
      SOURCE_SITE: ${SOURCE_SITE:-https://ipstream.cl}
    volumes:
      - site_data:/data
      - site_uploads:/app/uploads
    networks:
      - ipstream-net
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||80)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  site_data:
    name: ipstream_site_data
  site_uploads:
    name: ipstream_site_uploads

networks:
  ipstream-net:
    external: true
    name: ipstream-panel_ipstream-net
